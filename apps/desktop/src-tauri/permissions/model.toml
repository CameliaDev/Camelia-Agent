[[permission]]
identifier = "allow-read-model-settings"
description = "Read the model choice from ~/.camelia/config.json."
commands.allow = ["read_model_settings"]

[[permission]]
identifier = "allow-write-model-settings"
description = "Write the model choice into ~/.camelia/config.json."
commands.allow = ["write_model_settings"]

[[permission]]
identifier = "allow-read-key-status"
description = "Report whether a provider key is saved, without returning the key."
commands.allow = ["read_key_status"]

[[permission]]
identifier = "allow-write-provider-key"
description = "Write one provider API key into ~/.camelia/keys.json."
commands.allow = ["write_provider_key"]

[[permission]]
identifier = "allow-relaunch-app"
description = "Restart the desktop shell so a saved model is loaded."
commands.allow = ["relaunch_app"]
