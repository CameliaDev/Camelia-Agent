[package]
name = "camelia-desktop"
version = "0.1.0"
description = "Camelia desktop shell (Tauri 2.x) — Warm intelligence, sharp code."
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"

[features]
# Selects production asset embedding: with this feature the webview loads the bundled
# `frontendDist` instead of `devUrl`. `desktop:build` turns it on; `desktop:dev` leaves
# it off so the Vite dev server is used. Removing it silently ships a blank window.
custom-protocol = ["tauri/custom-protocol"]
